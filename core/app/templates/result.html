<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        img.logo {
            max-width: 150px;
            margin-bottom: 20px;
        }
        .result-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: left;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        .back-link:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="static/images/logo.png" alt="Company Logo" class="logo">
  
        <h2>Fastener Decision</h2>
        <p>Based on the image analysis, we have determined the most suitable fastener for your application.</p>

        <div class="result-box">
            <p><strong>Extracted Features:</strong></p>
            <pre>{{ features }}</pre>

            <p><strong>Fastener Recommendation:</strong></p>
            <pre>{{ fastener_decision }}</pre>
        </div>

        <a href="/" class="back-link">Upload Another</a>
    </div>

</body>
</html>
